name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: node:18-bullseye
    services:
      monerod:
        image: sethsimmons/simple-monerod:latest
        ports:
          - 18081:18081
          - 18080:18080
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Detect C++ changes and rebuild emscripten
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha || github.event.before }}
          if [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only $BASE_SHA HEAD | grep -qE '\.(cpp|h|hpp|cc)$'; then
              echo "C++ files changed, rebuilding emscripten..."
              npm run build:wasm || echo "wasm build script not found, skipping"
            fi
          fi
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
